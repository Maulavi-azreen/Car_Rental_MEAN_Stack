<div class="p-6">
    <h2 class="text-2xl font-bold text-orange-600 mb-4">Booking History</h2>
  
    <!-- Sorting -->
    <div class="mb-4 flex items-center gap-4">
      <label for="sortBy" class="text-gray-700 font-medium">Sort By:</label>
      <select id="sortBy" [(ngModel)]="sortBy" (change)="sortBookings()" class="p-2 rounded border border-gray-300">
        <option value="pickup">Pickup Date</option>
        <option value="return">Return Date</option>
      </select>
    </div>
  
    <!-- History Table -->
    <div class="overflow-x-auto bg-white shadow rounded-lg">
      <table class="min-w-full text-sm">
        <thead class="bg-gray-100 text-gray-700">
          <tr>
            <th class="p-4 text-left">Car</th>
            <th class="p-4 text-left">Pickup</th>
            <th class="p-4 text-left">Return</th>
            <th class="p-4 text-left">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let booking of bookingHistory" class="hover:bg-gray-50">
            <td class="p-4">{{ booking.car }}</td>
            <td class="p-4">{{ booking.pickup }}</td>
            <td class="p-4">{{ booking.return }}</td>
            <td class="p-4 capitalize">{{ booking.status }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
