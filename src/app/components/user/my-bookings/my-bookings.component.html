<div class="p-6">
    <h2 class="text-2xl font-bold text-orange-600 mb-4">My Bookings</h2>
  
    <!-- Filter Bar -->
    <div class="mb-4 flex items-center gap-4">
      <label for="status" class="text-gray-700 font-medium">Filter by Status:</label>
      <select id="status" [(ngModel)]="selectedStatus" (change)="filterBookings()" class="p-2 rounded border border-gray-300">
        <option value="">All</option>
        <option value="upcoming">Upcoming</option>
        <option value="ongoing">Ongoing</option>
        <option value="completed">Completed</option>
      </select>
    </div>
  
    <!-- Bookings Table -->
    <div class="overflow-x-auto bg-white shadow rounded-lg">
      <table class="min-w-full text-sm">
        <thead class="bg-gray-100 text-gray-700">
          <tr>
            <th class="p-4 text-left">Car</th>
            <th class="p-4 text-left">Pickup</th>
            <th class="p-4 text-left">Return</th>
            <th class="p-4 text-left">Status</th>
            <th class="p-4 text-left">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let booking of filteredBookings" class="hover:bg-gray-50">
            <td class="p-4">{{ booking.car }}</td>
            <td class="p-4">{{ booking.pickup }}</td>
            <td class="p-4">{{ booking.return }}</td>
            <td class="p-4 capitalize">{{ booking.status }}</td>
            <td class="p-4">
              <button *ngIf="booking.status === 'upcoming'" (click)="cancelBooking(booking.id)"
                class="text-red-600 hover:underline">Cancel</button>
              <span *ngIf="booking.status !== 'upcoming'" class="text-gray-400">N/A</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
