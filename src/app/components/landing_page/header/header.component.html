<nav class="fixed w-full top-0 left-0 z-50 bg-white transition-shadow duration-300" [ngClass]="{ 'shadow-lg': isScrolled }">
  <div class="container mx-auto flex items-center justify-between p-4 max-w-7xl">
    <!-- Logo -->
    <div class="flex items-center space-x-2 flex-grow sm:flex-grow-0">
      <img src="/assets/Logo.png" alt="Car Rental Logo" class="h-10 sm:h-12 md:h-14 lg:h-16 w-auto transition-all duration-300">
      <div class="flex flex-col">
        <span class="font-bold text-xl">UrbanRental</span>
        <span class="text-sm text-gray-500">Drive the City. Your way.</span>
      </div>
    </div>

    <!-- Hamburger Icon (For Small Screens) -->
    <div class="block sm:hidden p-2">
      <button (click)="toggleMenu()" class="text-black focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>

    <!-- Navigation Links (Visible on larger screens) -->
    <div class="hidden sm:flex space-x-8 mx-auto">
      <a routerLink="/" class="text-black hover:text-orange-600 font-bold">Home</a>
      <a routerLink="/" fragment="procedure" class="text-black hover:text-orange-600 font-bold">Procedure</a>
      <a routerLink="/" fragment="vehicle-models" class="text-black hover:text-orange-600 font-bold">Vehicle Models</a>
      <a routerLink="/" fragment="about-company-section" class="text-black hover:text-orange-600 font-bold">About</a>
      <a routerLink="/" fragment="testimonials" class="text-black hover:text-orange-600 font-bold">Testimonials</a>
      <a routerLink="/" fragment="contact" class="text-black hover:text-orange-600 font-bold">Contact</a>
    </div>

    <!-- Sign In / Register buttons (Visible on larger screens) -->
    <div class="hidden sm:flex space-x-4">
      <button routerLink="/login" class="bg-transparent text-black hover:text-black py-2 px-4 font-bold cursor-pointer">Sign In</button>
      <button routerLink="/sign-up" class="bg-orange-600 text-white py-2 px-4 rounded-md hover:bg-orange-600 font-bold cursor-pointer">Register</button>
    </div>
  </div>

  <!-- Mobile Menu (Initially Hidden) -->
  <div *ngIf="menuOpen" class="md:hidden flex flex-col space-y-4 p-4 bg-white border-t border-gray-200">
    <a routerLink="/" class="text-black hover:text-orange-600 font-bold">Home</a>
    <a href="#vehicle-models" class="text-black hover:text-orange-600 font-bold">Vehicle Models</a>
    <a href="#about" class="text-black hover:text-orange-600 font-bold">About</a>
    <a href="#testimonials" class="text-black hover:text-orange-600 font-bold">Testimonials</a>
    <a href="#contact" class="text-black hover:text-orange-600 font-bold">Contact</a>

    <!-- Sign In / Register buttons in Mobile Menu -->
    <div class="flex flex-col space-y-4 mt-4">
      <button rLink="/login" class="bg-transparent text-black hover:text-black py-2 px-4 font-bold">Sign In</button>
      <button rLink="/sign-up" class="bg-orange-600 text-white py-2 px-4 rounded-md hover:bg-orange-600 font-bold">Register</button>
    </div>
  </div>
</nav>
