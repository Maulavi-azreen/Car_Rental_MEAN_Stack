<section class="py-16 bg-gray-50 text-center" id="testimonials">
  <div class="container mx-auto px-4">

    <!-- Heading -->
    <h2 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-black mb-8">
      What Our Clients Say
    </h2>

    <!-- Subheading -->
    <p class="text-lg sm:text-xl text-gray-600 mb-8">
      See what our happy clients have to say about our services.
    </p>

    <!-- Testimonials -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let testimonial of testimonials" class="testimonial p-8 bg-white rounded-lg shadow-lg transform transition-all duration-300 ease-in-out hover:scale-105">
        <!-- Quote Icon -->
        <div class="mb-4 text-orange-600">
          <i class="fa fa-quote-left text-4xl"></i>
        </div>

        <!-- Testimonial Content -->
        <p class="text-lg text-gray-800 mb-4">
          "{{ testimonial.content }}"
        </p>

        <!-- Client Info -->
        <div class="flex items-center justify-start">
          <img [src]="testimonial.image" alt="Client" class="w-16 h-16 rounded-full mr-4">
          <div>
            <h3 class="font-semibold text-xl text-black">{{ testimonial.name }}</h3>
            <p class="text-sm text-gray-500">{{ testimonial.profession }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
