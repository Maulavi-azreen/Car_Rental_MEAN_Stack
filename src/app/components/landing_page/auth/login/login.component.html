<section class="py-16 bg-white text-black mt-7">
    <div class="container mx-auto px-4 max-w-md">
      <h2 class="text-4xl font-extrabold text-center text-black mb-8">Sign In to Your Account</h2>
  
      <form class="bg-gray-100 p-8 rounded-lg shadow-lg">
        <!-- Email Address -->
        <div class="mb-6">
          <label for="email" class="block text-xl font-semibold text-black mb-2">Email Address</label>
          <input type="email" id="email" name="email" class="w-full p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="Enter your email" required>
        </div>
  
        <!-- Password -->
        <div class="mb-6">
          <label for="password" class="block text-xl font-semibold text-black mb-2">Password</label>
          <input type="password" id="password" name="password" class="w-full p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="Enter your password" required>
        </div>
  
        <!-- Login Button -->
        <div class="mb-6">
          <button type="submit" class="w-full bg-orange-600 text-white py-3 rounded-lg text-lg font-semibold hover:bg-orange-700 focus:outline-none">
            Sign In
          </button>
        </div>
  
        <!-- Forgot Password Link -->
        <div class="text-center mb-6">
          <a routerLink="/forgot-password" class="text-orange-600 hover:text-orange-700 font-semibold">Forgot Password?</a>
        </div>
  
        <!-- Register Link -->
        <div class="text-center">
          <p class="text-gray-600">Don't have an account? <a routerLink="/sign-up" class="text-orange-600 hover:text-orange-700 font-semibold">Create an account</a></p>
        </div>
      </form>
    </div>
  </section>
