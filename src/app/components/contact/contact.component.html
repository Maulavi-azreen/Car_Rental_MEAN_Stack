<section class="py-16 bg-gray-100 text-black" id="contact">
    <div class="container mx-auto px-4 text-center">
      <h2 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-black mb-8">
        Contact Us
      </h2>
      <p class="text-lg sm:text-xl text-gray-400 mb-12">
        We're here to assist you! Reach out to us, and we'll get back to you as soon as possible.
      </p>
  
      <!-- Contact Form -->
      <div class="bg-white p-8 rounded-lg shadow-xl max-w-3xl mx-auto">
        <form>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6">
            <div>
              <label for="name" class="text-xl text-gray-800 mb-2 block">Full Name</label>
              <input type="text" id="name" name="name" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="Enter your full name" required>
            </div>
            <div>
              <label for="email" class="text-xl text-gray-800 mb-2 block">Email Address</label>
              <input type="email" id="email" name="email" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="Enter your email" required>
            </div>
          </div>
  
          <div class="mb-6">
            <label for="message" class="text-xl text-gray-800 mb-2 block">Message</label>
            <textarea id="message" name="message" rows="4" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="Write your message" required></textarea>
          </div>
  
          <div class="mb-6">
            <button type="submit" class="bg-orange-600 text-white py-3 px-8 rounded-lg text-lg font-semibold hover:bg-orange-700 transition-all focus:outline-none">
              Send Message
            </button>
          </div>
        </form>
      </div>
