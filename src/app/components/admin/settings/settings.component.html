<!-- Hero Section -->
<div class="relative h-56 rounded-lg overflow-hidden shadow-md mb-6">
    <img
      src="assets/settings-banner.jpg"
      alt="Settings Banner"
      class="w-full h-full object-cover"
    />
    <div class="absolute inset-0 bg-gray-800 bg-opacity-60 flex items-center justify-center">
      <h2 class="text-4xl font-bold text-white drop-shadow-md">Admin Settings</h2>
    </div>
  </div>
  
  <!-- Settings Form -->
  <div class="bg-white p-6 rounded-lg shadow max-w-2xl mx-auto">
    <h3 class="text-xl font-semibold text-gray-800 mb-4">Update Preferences</h3>
    <form>
      <div class="mb-4">
        <label class="block text-gray-600 mb-1">Site Title</label>
        <input type="text" class="w-full border border-gray-300 rounded px-4 py-2" placeholder="UrbanRide Admin" />
      </div>
      <div class="mb-4">
        <label class="block text-gray-600 mb-1">Admin Email</label>
        <input type="email" class="w-full border border-gray-300 rounded px-4 py-2" placeholder="admin@example.com" />
      </div>
      <div class="mb-4">
        <label class="block text-gray-600 mb-1">Notifications</label>
        <select class="w-full border border-gray-300 rounded px-4 py-2">
          <option>Email Only</option>
          <option>Push Only</option>
          <option>Both</option>
        </select>
      </div>
      <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
        Save Settings
      </button>
    </form>
  </div>
