<header
  class="bg-white text-white shadow-lg p-4 flex justify-between items-center sticky top-0 z-40"
>
  <!-- Sidebar Toggle (Mobile) -->
  <button
    class="lg:hidden text-white hover:bg-orange-600 p-2 rounded-full transition"
    (click)="toggleSidebar.emit()"
    aria-label="Toggle Sidebar"
  >
    <i class="fas fa-bars text-xl"></i>
  </button>

  <!-- Search Bar -->
  <div class="flex-1 mx-4 lg:mx-8">
    <div class="relative">
      <input
        type="text"
        placeholder="Search products, vouchers, price..."
        class="w-full lg:w-96 bg-gray-200 bg-opacity-20 text-gray-500 placeholder-gray-500 rounded-full py-2 px-4 outline-black focus:bg-opacity-30 transition"
        (keyup.enter)="onSearch()" 
      />
      <button
        class="absolute right-2 top-2 text-orange-500"
        aria-label="Search"
        
      >
        <i class="fas fa-search text-lg"></i>
      </button>
    </div>
  </div>

  <!-- Right Section: Profile, Notifications, Logout -->
  <div class="flex items-center space-x-4">
    <!-- Notifications -->
    <div class="relative">
      <button
        class="text-white p-2 rounded-full transition"
        (click)="notifications.length ? markNotificationsAsRead() : null"
        aria-label="Notifications"
      >
        <i class="fas fa-bell text-xl text-orange-600"></i>
        <span
          *ngIf="notifications.length"
          class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center"
        >
          {{ notifications.length }}
        </span>
      </button>
      <!-- Notification Dropdown -->
      <div
        *ngIf="notifications.length"
        class="absolute right-0 mt-2 w-64 bg-white text-gray-800 shadow-lg rounded-lg overflow-hidden z-50"
      >
        <div class="p-3 border-b">
          <h3 class="text-sm font-semibold">Notifications</h3>
        </div>
        <ul class="max-h-60 overflow-y-auto">
          <li
            *ngFor="let notification of notifications"
            class="p-3 hover:bg-gray-100 transition"
          >
            <p class="text-sm">{{ notification.message }}</p>
            <span class="text-xs text-gray-500">{{ notification.time }}</span>
          </li>
        </ul>
      </div>
    </div>

    <!-- Profile -->
    <div class="relative">
      <button
        class="flex items-center space-x-2 text-white p-2 rounded-full transition"
        (click)="toggleProfileDropdown()"
        aria-label="Profile Menu"
      >
        <img
          src="/assets/audi.png"
          alt="Admin Avatar"
          class="w-8 h-8 rounded-full object-cover"
        />
        <!-- <span class="hidden md:inline text-sm font-medium">{{ adminName }}</span> -->
      </button>
      <!-- Profile Dropdown -->
      <div
        *ngIf="isProfileDropdownOpen"
        class="absolute right-0 mt-2 w-48 bg-white text-gray-800 shadow-lg rounded-lg overflow-hidden z-50"
      >
        <a
          href="/admin/profile"
          class="block px-4 py-2 hover:bg-gray-100 transition"
          >Profile</a
        >
        <a
          href="/admin/settings"
          class="block px-4 py-2 hover:bg-gray-100 transition"
          >Settings</a
        >
        <button
          (click)="logout()"
          class="w-full text-left px-4 py-2 hover:bg-gray-100 transition text-red-600"
        >
          <i class="fas fa-sign-out-alt mr-2"></i> Logout
        </button>
      </div>
    </div>
  </div>
</header>
