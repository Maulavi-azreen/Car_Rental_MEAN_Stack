<!-- Hero Section -->
<div class="relative h-56 rounded-lg overflow-hidden shadow-md mb-6">
    <img
      src="assets/Hero_image.jpg"
      alt="Users Banner"
      class="w-full h-full object-cover"
    />
    <div class="absolute inset-0 flex items-center justify-center">
      <h2 class="text-4xl font-bold text-black drop-shadow-md">User Management</h2>
    </div>
  </div>
  
  <!-- Content -->
  <div class="bg-white shadow p-6 rounded-lg">
    <h3 class="text-2xl font-semibold mb-4 text-gray-800">All Users</h3>
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">Name</th>
          <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">Email</th>
          <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">Role</th>
          <th class="px-4 py-2 text-left text-sm font-medium text-gray-600">Status</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let user of users">
          <td class="px-4 py-2">{{ user.name }}</td>
          <td class="px-4 py-2">{{ user.email }}</td>
          <td class="px-4 py-2">{{ user.role }}</td>
          <td class="px-4 py-2">
            <span [ngClass]="user.active ? 'text-green-600' : 'text-red-600'">
              {{ user.active ? 'Active' : 'Inactive' }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
