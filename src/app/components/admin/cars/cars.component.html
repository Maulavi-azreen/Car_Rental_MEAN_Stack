<div class="p-6 bg-white min-h-screen">
    <h2 class="text-2xl font-bold text-orange-500 mb-6">Manage Cars</h2>
  
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let car of cars" class="bg-gray-100 rounded-2xl shadow-md hover:shadow-lg transition-all duration-300">
        <img [src]="car.image" [alt]="car.name" class="rounded-t-2xl w-full h-48 object-cover">
        
        <div class="p-4">
          <h3 class="text-lg font-semibold text-black">{{ car.name }}</h3>
          <p class="text-sm text-gray-600">Model: {{ car.model }}</p>
          <p 
            class="text-sm mt-1 font-medium"
            [ngClass]="{
              'text-green-600': car.status === 'Available',
              'text-red-500': car.status === 'Booked',
              'text-yellow-500': car.status === 'Maintenance'
            }"
          >
            Status: {{ car.status }}
          </p>
          <button class="mt-4 bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-xl transition-all w-full">
            Edit
          </button>
        </div>
      </div>
    </div>
  </div>
